{% extends "layouts/base.html" %} 

{% block extra_css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/navbar.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/landing.css') }}"
/>
{% endblock %}

{% block title %}Calculadora de Notas - Agregar Curso{% endblock %}

{% block content %}

<section class="hero-section">
  <div class="hero-content">
    <div class="hero-field">
      <h1 style="text-align:center; font-size: 32px; margin-bottom: 20px">Agrega un nuevo ramo</h1> 

      <h3>Nombre</h3>
      <input class="hero-input" required type="text" name="Nombre del ramo" value="Ingrese el nombre del ramo...">

      <h3>Sigla</h3>
      <input class="hero-input" required type="text" name="Nombre del ramo" value="Ingrese el nombre del ramo...">

      <div style="margin-top: 20px; display: flex; align-items: center; gap: 10px">
        <input class="hero-checkbox" type="checkbox">
        <h3>Certamenes</h3>
      </div>
      
      <div class="certamenes-container">
        <h4>Cantidad</h4>
        <input class="hero-input" style="width: 100px" type="number" value=1 max=100 min=0>
      </div>


    </div>
  </div>
</section>

{% endblock %}
